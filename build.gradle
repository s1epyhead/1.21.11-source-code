// 1.21.11 is the last obfuscated release, so this uses the remapping Loom plugin with Mojang's official mappings.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def props = [version: project.version, minecraft: project.minecraft_version, java: project.java_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

// In-game screenshot test: ./gradlew runClientGameTest (needs a display, e.g. xvfb-run)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "blocks-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

loom {
    runs.matching { it.name == 'clientGameTest' }.configureEach {
        programArgs '--width', '1920', '--height', '1080'
    }
}
